<html lang="ko">
<head>

<title>매일 영단어 20</title>
<meta name="theme-color" content="#FFC93C">
<meta name="description" content="초등 필수 영단어를 하루 20개씩 듣고, 읽고, 쓰고, 게임으로 확인하는 앱">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영단어">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
:root{
  --paper:#FFFDF6; --ink:#1E2A5A; --card:#FFFFFF; --line:#DFE5F3; --muted:#5D6888;
  --sun:#FFC93C; --mint:#2EC4B6; --coral:#FF6B6B; --ok:#1FA87A; --sky:#E4EFFF;
  --grid:rgba(30,42,90,.06); --on-sun:#1E2A5A;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141A33; --ink:#F2F4FF; --card:#1E2647; --line:#2E3864; --muted:#A9B2D6;
    --sun:#FFD25E; --mint:#3DD6C8; --coral:#FF8A8A; --ok:#3DDC9C; --sky:#24305C;
    --grid:rgba(255,255,255,.045); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141A33; --ink:#F2F4FF; --card:#1E2647; --line:#2E3864; --muted:#A9B2D6;
  --sun:#FFD25E; --mint:#3DD6C8; --coral:#FF8A8A; --ok:#3DDC9C; --sky:#24305C;
  --grid:rgba(255,255,255,.045); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:16px; line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px; min-height:100%;
}
h1,h2,h3{font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400;margin:0;line-height:1.25}
h2{font-size:26px} h3{font-size:19px;margin-bottom:8px}
p{margin:0}
.en{font-family:"Fredoka","Jua",ui-rounded,system-ui,sans-serif;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 120px}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 18px}
.top h1{font-size:30px}
.badges{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:14px;color:var(--muted);white-space:nowrap}

/* buttons: sticker look */
.btn{
  font-family:"Jua",sans-serif;font-size:18px;border:2px solid var(--ink);background:var(--card);
  border-radius:14px;padding:11px 16px;box-shadow:0 3px 0 var(--ink);cursor:pointer;color:var(--ink);
  transition:transform .08s, box-shadow .08s;
}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.sun{background:var(--sun);color:var(--on-sun)}
.btn.small{font-size:15px;padding:7px 12px;border-radius:11px}
.btn.wide{display:block;width:100%;margin-top:18px;font-size:21px;padding:15px}
.btn.danger{border-color:var(--coral);color:var(--coral);box-shadow:0 3px 0 var(--coral)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}
.center{text-align:center}
.hint{color:var(--muted);font-size:15px;margin:6px 0 12px}
.vh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.big-emoji{font-size:54px;line-height:1;margin-bottom:8px}

/* progress */
.prog{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:14px;color:var(--muted);white-space:nowrap}
.bar{flex:1;height:14px;border:2px solid var(--ink);border-radius:99px;background:var(--card);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--mint);transition:width .35s}

/* word list */
.words{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.wrow{display:grid;grid-template-columns:28px 1fr auto;gap:4px 10px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 12px 12px 10px;position:relative}
.wrow .num{font-family:"Fredoka",sans-serif;color:var(--muted);font-size:14px;text-align:center}
.wtxt{display:flex;flex-direction:column;min-width:0}
.wtxt .big{font-size:27px;line-height:1.15;overflow-wrap:anywhere}
.mean{color:var(--muted);font-size:15px}
.wrow .write{grid-column:2 / 4;border:2px dashed var(--line);background:transparent;border-radius:12px;padding:9px 12px;font-size:20px;width:100%}
.wrow.ok{border-color:var(--ok)}
.wrow.ok .write{border-style:solid;border-color:var(--ok);color:var(--ok)}
.wrow.ok::after{content:"✓";position:absolute;top:-10px;right:-6px;width:26px;height:26px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-weight:700}
.wrow.now{box-shadow:0 0 0 3px var(--sun)}
.say{width:46px;height:46px;border-radius:50%;border:2px solid var(--ink);background:var(--sky);font-size:20px;cursor:pointer;flex:none}
.say.xl{width:110px;height:110px;font-size:46px;box-shadow:0 4px 0 var(--ink)}
.banner{background:var(--sun);color:var(--on-sun);border:2px solid var(--ink);border-radius:18px;padding:16px;margin-bottom:18px;box-shadow:0 4px 0 var(--ink)}
.banner b{font-family:"Jua",sans-serif;font-weight:400;font-size:21px}
.banner p{margin:4px 0 12px}
.banner .btn{background:var(--card);color:var(--ink)}

/* game */
.gtop{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);margin-bottom:14px;white-space:nowrap}
.gcard{background:var(--card);border:2px solid var(--ink);border-radius:22px;padding:20px 16px 22px;box-shadow:0 5px 0 var(--ink);text-align:center}
.gtype{font-family:"Jua",sans-serif;color:var(--muted);font-size:16px}
.again{display:inline-block;background:var(--coral);color:#fff;border-radius:99px;padding:1px 9px;font-size:13px;margin-left:6px;vertical-align:1px}
.prompt{display:flex;align-items:center;justify-content:center;gap:12px;min-height:120px;margin:6px 0}
.huge{font-size:44px;line-height:1.15;overflow-wrap:anywhere}
.ko.huge{font-family:"Jua",sans-serif;font-size:40px}
.ask{font-size:17px;margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:2px solid var(--ink);background:var(--paper);border-radius:14px;padding:16px 8px;font-size:20px;min-height:66px;cursor:pointer;box-shadow:0 3px 0 var(--ink);font-family:"Jua",sans-serif}
.opt.en{font-family:"Fredoka",sans-serif;font-weight:600;font-size:22px}
.opt.good{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{background:var(--coral);color:#fff;border-color:var(--coral)}
.slots,.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:10px 0}
.slot{width:40px;height:48px;border:0;border-bottom:3px solid var(--ink);background:transparent;font-family:"Fredoka",sans-serif;font-weight:600;font-size:26px;cursor:pointer}
.slot.fill{color:var(--mint)}
.tile{width:46px;height:50px;border:2px solid var(--ink);border-radius:12px;background:var(--sun);color:var(--on-sun);font-size:24px;box-shadow:0 3px 0 var(--ink);cursor:pointer}
.tile:disabled{opacity:.2;box-shadow:none}
.spellrow{display:flex;gap:8px}
.spellrow input{flex:1;min-width:0;border:2px solid var(--ink);border-radius:14px;padding:12px;font-size:24px;background:var(--paper);text-align:center}
.fb{margin-top:16px;border-radius:14px;padding:14px;font-size:17px}
.fb.good{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok);font-family:"Jua",sans-serif;font-size:22px}
.fb.bad{background:color-mix(in srgb,var(--coral) 16%,transparent)}
.fb.bad b{color:var(--coral);font-family:"Jua",sans-serif;font-weight:400;font-size:20px}
.fb.bad .en{font-size:22px}
.fb p{color:var(--muted);font-size:14px;margin:4px 0 10px}

/* record */
.hero-rec{text-align:center;margin:18px 0 16px}
.mega{font-size:76px;line-height:1;color:var(--mint);display:block}
.hero-rec p{font-family:"Jua",sans-serif;font-size:19px}
.mini{display:flex;justify-content:center;gap:16px;color:var(--muted);font-size:14px;margin-top:6px;flex-wrap:wrap}
.week,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week span{text-align:center;font-size:13px;color:var(--muted)}
.cal{margin-top:6px}
.cell{aspect-ratio:1;border-radius:11px;background:var(--card);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;padding:0;color:var(--ink)}
.cell.empty{background:transparent;border:0}
.cell.done{background:var(--sun);color:var(--on-sun);border:2px solid var(--ink);cursor:pointer}
.cell.today{outline:2px dashed var(--coral);outline-offset:1px}
.cell.sel{box-shadow:0 0 0 3px var(--mint)}
.dn{font-family:"Fredoka",sans-serif}
.dc{font-size:11px;font-family:"Fredoka",sans-serif;font-weight:600}
.chips{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-wrap:wrap;gap:7px}
.chips button{border:1.5px solid var(--line);background:var(--paper);border-radius:99px;padding:6px 12px;font-size:14px;cursor:pointer}
.months{width:100%;border-collapse:collapse;margin-top:6px;font-size:15px}
.months td{padding:8px 4px;border-bottom:1px solid var(--line)}
.months td:last-child{text-align:right;font-family:"Fredoka",sans-serif;font-weight:600}

/* settings */
.form label{display:block;margin-bottom:14px;font-size:15px}
.form input:not([type=checkbox]),.form select,.form textarea{display:block;width:100%;margin-top:6px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);font-size:16px}
.form label.check{display:flex;align-items:center;gap:8px}
.form input[type=checkbox]{width:22px;height:22px;accent-color:var(--mint)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:2px solid var(--ink);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.nav button{border:0;background:transparent;border-radius:12px;padding:6px 2px;font-family:"Jua",sans-serif;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--ink)}
.nav button span{font-size:22px;line-height:1}
.nav button.on{background:var(--sun);color:var(--on-sun)}
.nav-inner{display:contents}

/* celebration */
.cele{position:fixed;inset:0;z-index:50;background:rgba(20,26,51,.55);display:grid;place-items:center;padding:20px}
.cele canvas{position:fixed;inset:0;pointer-events:none}
.celecard{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:26px;padding:26px 20px 22px;max-width:380px;width:100%;text-align:center;box-shadow:0 7px 0 var(--ink);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.trophy{font-size:76px;line-height:1;animation:bob 1.4s ease-in-out infinite}
.celecard h2{font-size:32px;margin-top:8px}
.bigline{font-size:18px;margin-top:4px}
.bigline .en{font-size:26px;color:var(--mint)}
.stats{list-style:none;padding:0;margin:18px 0 8px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats li{background:var(--paper);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column}
.stats b{font-family:"Fredoka",sans-serif;font-size:26px}
.stats span{font-size:12px;color:var(--muted);line-height:1.3}
.celecard .row{justify-content:center}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bob{50%{transform:translateY(-8px) rotate(-6deg)}}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);border-radius:99px;padding:9px 18px;font-size:15px;max-width:90vw}
.wrow.hasmic{grid-template-columns:28px 1fr auto auto}
.wrow.hasmic .write{grid-column:2 / 5}
.wrow.spoken .rmic{background:var(--coral);color:#fff;border-color:var(--coral)}
.said{font-size:13px;color:var(--coral);min-height:0}
.said:empty{display:none}
.bar>i.coral{background:var(--coral)}
.mic{width:96px;height:96px;border-radius:50%;border:3px solid var(--ink);background:var(--coral);color:#fff;font-size:42px;box-shadow:0 4px 0 var(--ink);cursor:pointer;margin:4px auto 6px;display:block}
.mic:disabled{opacity:.4}
.mic.listening,.rmic.listening{animation:pulse 1s ease-in-out infinite;background:var(--mint)}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 10px color-mix(in srgb,var(--mint) 30%,transparent)}}
.heard{font-size:15px;color:var(--muted);min-height:22px;margin:4px 0 10px}
.okline{font-family:"Jua",sans-serif;font-size:20px;color:var(--ok);margin-bottom:12px}
.dots{color:var(--mint);letter-spacing:2px;font-size:14px;margin-left:4px}
.steps{margin:14px 0 0;padding-left:22px;display:grid;gap:10px}
.steps li b{font-family:"Jua",sans-serif;font-weight:400;font-size:18px;display:block}
.steps li span{color:var(--muted);font-size:14px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.huge{font-size:36px}.ko.huge{font-size:32px}.tile{width:40px}.slot{width:34px}}
</style>
</head>

<div class="wrap">
  <header class="top">
    <h1 id="hname">영단어 노트</h1>
    <div class="badges"><span id="hstreak"></span><span id="hmonth"></span></div>
  </header>
  <main id="main"></main>

<nav class="nav" aria-label="메뉴">

const BANK_ABC = BANK_RAW.trim().split('\n').map(l => { const [w, m] = l.split('|'); return { w: w.trim(), m: m.trim() }; });
/* 매일 다양한 단어가 섞여 나오도록 고정된 순서로 섞기 (모든 기기에서 같은 순서) */
function seeded(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const BANK = (() => { const r = seeded(2022), a = BANK_ABC.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; })();
const BANK_VERSION = 2;

/* ===== 유틸 ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = a => a[Math.floor(Math.random() * a.length)];
const norm = s => String(s).trim().toLowerCase().replace(/\s+/g, ' ');
const dkey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }

/* ===== 저장: 계정(db) 우선, 안 되면 이 기기(localStorage) ===== */
const LS_KEY = 'vocab20-state-v1';
const DEFAULT = { v: 1, name: '', perDay: 20, rate: 0.85, sfx: true, useCustom: false, custom: [], ptr: { base: 0, custom: 0 }, records: {}, today: null, updatedAt: 0 };
function normalize(o) {
  const s = Object.assign({}, DEFAULT, o || {});
  s.ptr = Object.assign({ base: 0, custom: 0 }, s.ptr || {});
  s.records = s.records && typeof s.records === 'object' ? s.records : {};
  s.custom = Array.isArray(s.custom) ? s.custom : [];
  return s;
}
function loadLocal() { try { const r = localStorage.getItem(LS_KEY); return normalize(r ? JSON.parse(r) : null); } catch (e) { return normalize(null); } }
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { /* 저장 불가 환경 */ } }
let S = loadLocal();
let remote = null, saveTimer = null, saving = false, pending = false;
function save() {
  S.updatedAt = Date.now(); saveLocal();
  if (remote) { clearTimeout(saveTimer); saveTimer = setTimeout(pushRemote, 800); }
}
async function pushRemote() {
  if (!remote) return;
  if (saving) { pending = true; return; }
  saving = true;
  try { await remote.set(JSON.parse(JSON.stringify(S))); } catch (e) { console.warn('계정 저장 실패, 이 기기에는 저장됨', e); }
  saving = false;
  if (pending) { pending = false; pushRemote(); }
}
async function initRemote() {
  for (let i = 0; i < 20 && !(window.claude && window.claude.use); i++) await new Promise(r => setTimeout(r, 150));
  if (!(window.claude && window.claude.use)) return;
  try {
    const db = await window.claude.use('db'); if (!db) return;
    const user = await window.claude.use('user'); if (!user) return;
    const uid = await user.id(); if (!uid) return;
    const ref = db.doc('data/users/' + uid + '/profile');
    const snap = await ref.get();
    if (snap.exists) {
      const r = snap.data();
      if (r && (r.updatedAt || 0) > (S.updatedAt || 0)) { S = normalize(JSON.parse(JSON.stringify(r))); saveLocal(); if (!G) render(); else renderHeader(); }
      else if ((S.updatedAt || 0) > ((r && r.updatedAt) || 0)) await ref.set(JSON.parse(JSON.stringify(S)));
    } else {
      await ref.set(JSON.parse(JSON.stringify(S)));
    }
    remote = ref;
    const si = $('#storeinfo'); if (si) si.textContent = storeText();
  } catch (e) { console.warn('계정 저장 연결 안 됨, 이 기기 저장 사용', e); }
}
const storeText = () => remote ? '기록이 내 계정에 저장돼요. 다른 기기에서 열어도 이어져요.' : '기록이 이 휴대폰 안에 저장돼요. 휴대폰을 바꾸거나 앱을 지우기 전에 꼭 백업해 주세요.';

/* ===== 단어 세트 ===== */
const activeList = () => (S.useCustom && S.custom.length) ? S.custom : BANK;
const ptrKey = () => (S.useCustom && S.custom.length) ? 'custom' : 'base';
function nextWords() {
  const L = activeList(), n = Math.min(S.perDay, L.length), p = S.ptr[ptrKey()] % L.length, out = [];
  for (let i = 0; i < n; i++) out.push(L[(p + i) % L.length]);
  return out;
}
const newSet = d => ({ date: d, words: nextWords(), written: {}, done: false });
function ensureToday() {
  const d = dkey(new Date());
  if (S.bankV !== BANK_VERSION) { S.ptr.base = 0; if (S.today && !S.today.done && ptrKey() === 'base') S.today = null; S.bankV = BANK_VERSION; save(); }
  if (!S.today) { S.today = newSet(d); save(); return; }
  if (S.today.date !== d) { if (S.today.done) S.today = newSet(d); else S.today.date = d; save(); }
}
function completeToday(stats) {
  const d = dkey(new Date());
  const rec = S.records[d] || { count: 0, words: [], sets: 0, retries: 0 };
  rec.count += S.today.words.length;
  rec.words = rec.words.concat(S.today.words.map(x => x.w + '|' + x.m));
  rec.sets += 1; rec.retries += stats.retries;
  S.records[d] = rec;
  S.ptr[ptrKey()] += S.today.words.length;
  S.today.done = true;
  save();
}
const monthTotal = ym => Object.entries(S.records).filter(([k]) => k.startsWith(ym)).reduce((s, [, r]) => s + (r.count || 0), 0);
const allTotal = () => Object.values(S.records).reduce((s, r) => s + (r.count || 0), 0);

const sfxNo = () => { if (!S.sfx) return; tone(240, 0, .18, 'square', .05); tone(180, .15, .28, 'square', .05); };

  if (!S.sfx) return;
  [[392, 0, .14], [523, .15, .14], [659, .30, .14], [784, .45, .32], [659, .80, .12], [784, .93, .55]].forEach(([f, s, d]) => { tone(f, s, d, 'square', .06); tone(f / 2, s, d, 'triangle', .1); });

function confetti(cv) {

  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  const cols = ['#FFC93C', '#2EC4B6', '#FF6B6B', '#5B8CFF', '#9B5DE5'];
  const burst = (x) => Array.from({ length: 110 }, () => ({ x, y: H * .4, vx: (Math.random() - .5) * 15 * dpr, vy: (-Math.random() * 17 - 5) * dpr, s: (6 + Math.random() * 8) * dpr, r: Math.random() * 6, vr: (Math.random() - .5) * .35, c: rand(cols) }));

/* ===== 말하기 인식 (아이가 소리 내어 읽은 것 확인) ===== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let srOK = !!SR, srBusy = null;
const NUMW = { '0': 'zero', '1': 'one', '2': 'two', '3': 'three', '4': 'four', '5': 'five', '6': 'six', '7': 'seven', '8': 'eight', '9': 'nine', '10': 'ten', '11': 'eleven', '12': 'twelve', '13': 'thirteen', '20': 'twenty', '30': 'thirty', '100': 'one hundred', '1st': 'first', '2nd': 'second', '3rd': 'third', '21st': 'twenty first', '22nd': 'twenty second', '23rd': 'twenty third', 'ok': 'okay', '2x': 'twice' };
const cleanSay = s => norm(s).replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(Boolean).map(t => NUMW[t] || t).join(' ').trim();
function lev(a, b) { const m = a.length, n = b.length; if (!m) return n; if (!n) return m; let p = Array.from({ length: n + 1 }, (_, j) => j); for (let i = 1; i <= m; i++) { const c = [i]; for (let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); p = c; } return p[n]; }
const simi = (a, b) => 1 - lev(a, b) / Math.max(a.length, b.length, 1);
/* 인식된 여러 후보 중 하나라도 단어와 같거나 아주 비슷하면 맞음 */
function heardMatch(alts, word) {
  const w = cleanSay(word.replace(/-/g, ' ')), wj = w.replace(/ /g, '');
  return alts.some(t => {
    const s = cleanSay(t); if (!s) return false;
    const sj = s.replace(/ /g, ''), toks = s.split(' ');
    if (s === w || sj === wj || toks.includes(wj)) return true;
    if (wj.length >= 4 && sj.includes(wj)) return true;
    const best = Math.max(simi(sj, wj), ...toks.map(x => simi(x, wj)));
    return wj.length <= 3 ? best >= 0.67 : best >= 0.78;

}
function listenOnce(btn, onAlts, onFail) {

  r.lang = 'en-US'; r.interimResults = false; r.maxAlternatives = 5; r.continuous = false;
  r.onresult = e => { got = true; onAlts([...e.results[0]].map(a => a.transcript)); };
  r.onerror = e => { got = true; if (['not-allowed', 'service-not-allowed', 'audio-capture'].includes(e.error)) srOK = false; onFail(e.error); };
  r.onend = () => { srBusy = null; if (btn) btn.classList.remove('listening'); if (!got) onFail('no-speech'); };

function failText(err) {

  if (err === 'no-speech') return '소리가 안 들렸어요. 🎤를 누르고 조금 더 크게 읽어 보세요.';

  return '잘 안 들렸어요. 🎤를 다시 눌러 주세요.';
}

/* ===== 게임: 단어마다 3단계를 모두 통과해야 완성 =====
   1단계 읽기: 소리 내어 읽기 → 뜻 고르기
   2단계 뜻 알기: 뜻 고르기 / 듣고 고르기 / 영어 고르기 중 하나
   3단계 떠올리기: 철자 쓰기 / 글자 맞추기 / 뜻 보고 영어로 말하기 중 하나
   틀리면 같은 단계를 다른 게임으로 다시 냄 */
const STAGES = ['read', 'know', 'make'];
const TNAME = { read: '읽고 뜻 말하기', meaning: '뜻 고르기', listen: '듣고 고르기', pick: '영어 고르기', scramble: '글자 맞추기', spell: '철자 쓰기', recall: '뜻 보고 말하기' };
const variants = st => st === 'read' ? ['read'] : st === 'know' ? ['meaning', 'listen', 'pick'] : (srOK ? ['spell', 'scramble', 'recall'] : ['spell', 'scramble']);
function mkItem(w, stage, avoid) {
  const all = variants(stage); let used = avoid || [];
  let pool = all.filter(v => !used.includes(v)); if (!pool.length) { pool = all; used = []; }
  return { w, stage, type: rand(pool), used };
}
let G = null;
function startSession() {
  const words = S.today.words.slice();
  G = { words, prog: Object.fromEntries(words.map(w => [w.w, 0])), queue: shuffle(words.map(w => mkItem(w, 'read'))), retries: 0, wrong: new Set(), cur: null, locked: false };
  G.cur = G.queue.shift();
  view = 'game'; render();
}
function nextQ() {
  if (!G) return;
  stopListen();
  if (!G.queue.length) { finishGame(); return; }
  G.cur = G.queue.shift(); G.locked = false; renderQ();
}
function answer(ok) {
  if (!G || G.locked) return;
  G.locked = true; stopListen();
  const q = G.cur;
  if (ok) {
    G.prog[q.w.w]++; sfxOk(); if (q.type !== 'read' && q.type !== 'recall') speak(q.w.w);
    showFb(true, q); updGameBar();
    if (G.prog[q.w.w] < 3) G.queue.splice(Math.min(G.queue.length, 4 + Math.floor(Math.random() * 4)), 0, mkItem(q.w, STAGES[G.prog[q.w.w]]));
    setTimeout(nextQ, 950);
  } else {
    sfxNo(); G.retries++; G.wrong.add(q.w.w);
    G.queue.splice(Math.min(G.queue.length, 2 + Math.floor(Math.random() * 3)), 0, mkItem(q.w, q.stage, q.used.concat(q.type)));
    showFb(false, q);
  }
}
function finishGame() {
  const stats = { retries: G.retries, wrong: G.wrong.size }, n = G.words.length;
  completeToday(stats); G = null; render(); celebrate(n, stats);
}
function updGameBar() {
  const b = $('#gbar'), c = $('#gcnt'); if (!b || !G) return;
  const n = G.words.length, steps = Object.values(G.prog).reduce((s, v) => s + v, 0), done = Object.values(G.prog).filter(v => v >= 3).length;
  b.style.width = (steps / (n * 3) * 100) + '%';

}
const dots = w => { const p = G.prog[w]; return '<span class="dots" aria-label="3단계 중 ' + p + '단계 통과">' + [0, 1, 2].map(i => i < p ? '●' : '○').join('') + '</span>'; };
function opts(q, f) {

  return '<div class="opts">' + shuffle([q.w, ...ds]).map(x => `<button class="opt ${f === 'w' ? 'en' : ''}" data-act="opt" data-v="${esc(x[f])}">${esc(x[f])}</button>`).join('') + '</div>';
}
function scr(w) {
  const arr = w.split('').map((c, i) => ({ c, i })); let s, tries = 0;
  do { s = shuffle(arr); } while (w.length > 1 && s.map(x => x.c).join('') === w && ++tries < 12);
  return s;
}
function readZone(q, msg) {
  if (q.step === 'mean') return `<p class="okline">잘 읽었어요! 이 단어의 뜻은?</p>` + opts(q, 'm');
  if (!srOK) return `<p class="ask">🔊를 듣고 소리 내어 따라 읽어요</p>${msg ? `<p class="heard">${esc(msg)}</p>` : ''}<button class="btn sun" data-act="readok">따라 읽었어요</button>`;
  return `<p class="ask">🎤를 누르고 단어를 소리 내어 읽어요</p><button class="mic" data-act="mic" aria-label="눌러서 읽기">🎤</button><p class="heard" aria-live="polite">${msg ? esc(msg) : ''}</p>${(q.tries >= 2 || !navigator.onLine) ? `<button class="btn small" data-act="readok">${navigator.onLine ? '잘 읽었는데 인식이 안 돼요' : '소리 내어 읽었어요'}</button>` : ''}`;
}
function renderQ() {
  const a = $('#garea'); if (!a || !G || !G.cur) return;
  const q = G.cur; q.tries = 0; q.step = 'say'; updGameBar();
  let h = `<p class="gtype">${TNAME[q.type]} ${dots(q.w.w)}${q.used.length ? '<span class="again">다시 도전</span>' : ''}</p>`;
  if (q.type === 'read') h += `<div class="prompt"><span class="en huge">${esc(q.w.w)}</span><button class="say" data-act="say" data-say="${esc(q.w.w)}" aria-label="발음 듣기">🔊</button></div><div id="readzone">${readZone(q)}</div>`;
  else if (q.type === 'meaning') h += `<div class="prompt"><span class="en huge">${esc(q.w.w)}</span><button class="say" data-act="say" data-say="${esc(q.w.w)}" aria-label="발음 듣기">🔊</button></div><p class="ask">어떤 뜻일까요?</p>` + opts(q, 'm');
  else if (q.type === 'listen') h += `<div class="prompt"><button class="say xl" data-act="say" data-say="${esc(q.w.w)}" aria-label="다시 듣기">🔊</button></div><p class="ask">들리는 단어를 골라요</p>` + opts(q, 'w');

  else h += `<div class="prompt"><span class="ko huge">${esc(q.w.m)}</span><button class="say" data-act="say" data-say="${esc(q.w.w)}" aria-label="소리 힌트">🔊</button></div><p class="ask">영어로 써 보세요 (${q.w.w.length}글자)</p><div class="spellrow"><input id="spellin" class="en" aria-label="영어 단어 쓰기" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="btn sun" data-act="spell">확인</button></div>`;
  h += '<div id="fb" class="fb" hidden></div>';

function onMic(b) {
  const q = G && G.cur; if (!q || G.locked) return;
  listenOnce(b, alts => {
    if (!G || G.cur !== q || G.locked) return;
    const ok = heardMatch(alts, q.w.w), said = alts[0] || '';
    if (q.type === 'read') {
      if (ok) { sfxOk(); q.step = 'mean'; $('#readzone').innerHTML = readZone(q); }
      else { q.tries++; $('#readzone').innerHTML = readZone(q, `이렇게 들렸어요: “${said}” 발음을 한 번 더 듣고 읽어 볼까요?`); setTimeout(() => speak(q.w.w), 200); }
    } else if (q.type === 'recall') {
      if (ok) answer(true);
      else { q.tries++; if (q.tries >= 2) answer(false); else { $('#heard').textContent = `이렇게 들렸어요: “${said}” 한 번 더 말해 볼까요?`; } }
    }
  }, err => {
    if (!G || G.cur !== q || G.locked) return;
    if (!srOK) { toast('마이크를 쓸 수 없어서 버튼으로 확인하는 방식으로 바꿨어요'); if (q.type === 'recall') { q.type = 'spell'; renderQ(); } else $('#readzone').innerHTML = readZone(q); return; }
    if (err === 'network' && q.type === 'read') { q.tries = 2; $('#readzone').innerHTML = readZone(q, failText(err)); return; }
    if (err === 'network' && q.type === 'recall') { toast(failText(err)); q.type = 'spell'; renderQ(); return; }

function drawScr() {

  tl.innerHTML = q.letters.map((x, k) => `<button class="tile en" data-act="tile" data-k="${k}" ${q.picked.includes(k) ? 'disabled' : ''}>${esc(x.c)}</button>`).join('');

  const left = 3 - G.prog[q.w.w];
  fb.innerHTML = ok ? (left ? rand(['정답!', '잘했어요!', '좋아요!', '멋져요!']) + ` ${q.w.w} 완성까지 ${left}단계 남았어요` : `🌟 ${esc(q.w.w)} 완벽하게 외웠어요!`)
    : `<b>아쉬워요!</b> 정답은 <span class="en">${esc(q.w.w)}</span> (${esc(q.w.m)})<p>이 단어는 조금 뒤에 다른 게임으로 다시 나와요.</p><button class="btn sun" data-act="next">다음 문제</button>`;
  $('#garea').querySelectorAll('.opt,.tile,.slot,.mic,#spellin,[data-act="spell"],[data-act="clear"],[data-act="giveup"],[data-act="readok"]').forEach(el => el.disabled = true);

}
function celebrate(n, stats) {

  ov.innerHTML = `<canvas></canvas><div class="celecard" role="dialog" aria-modal="true" aria-label="오늘 단어 완료">
    <div class="trophy">🏆</div><h2>해냈어요${S.name ? ', ' + esc(S.name) : ''}!</h2>
    <p class="bigline">오늘 <span class="en">${n}</span>개 단어를<br>읽고, 뜻을 알고, 스스로 떠올렸어요</p>
    <ul class="stats"><li><b>${monthTotal(dkey(new Date()).slice(0, 7))}</b><span>이번 달<br>외운 단어</span></li><li><b>${streak()}</b><span>연속<br>공부한 날</span></li><li><b>${stats.wrong}</b><span>다시 도전해서<br>맞힌 단어</span></li></ul>

  else m.innerHTML = vSettings();
}
function vToday() {
  const t = S.today, n = t.words.length; t.spoken = t.spoken || {};
  const wc = t.words.filter(x => t.written[x.w]).length, sc = t.words.filter(x => t.spoken[x.w]).length;
  return `${t.done ? `<section class="banner"><b>🎉 오늘 단어를 다 외웠어요!</b><p>아래에서 복습하거나 다음 세트를 더 할 수 있어요.</p><button class="btn" data-act="more">다음 ${S.perDay}개 더 하기</button></section>` : ''}
  <div class="vh"><h2>오늘의 단어 ${n}개</h2><button class="btn small" data-act="all">🔊 모두 듣기</button></div>
  <p class="hint">🔊로 발음을 듣고${srOK ? ', 🎤를 눌러 따라 읽고' : ''}, 칸에 직접 써 보세요.</p>
  <div class="prog"><div class="bar"><i id="wbar" style="width:${n ? wc / n * 100 : 0}%"></i></div><span id="wcnt">✍️ ${wc} / ${n}</span></div>
  ${srOK ? `<div class="prog"><div class="bar"><i id="sbar" class="coral" style="width:${n ? sc / n * 100 : 0}%"></i></div><span id="scnt">🗣️ ${sc} / ${n}</span></div>` : ''}
  <ol class="words">${t.words.map((x, i) => `<li class="wrow ${t.written[x.w] ? 'ok' : ''} ${t.spoken[x.w] ? 'spoken' : ''} ${srOK ? 'hasmic' : ''}" data-w="${esc(x.w)}">
    <span class="num">${i + 1}</span>
    <div class="wtxt"><span class="en big">${esc(x.w)}</span><span class="mean">${esc(x.m)}</span><span class="said" aria-live="polite"></span></div>
    <button class="say" data-act="say" data-say="${esc(x.w)}" aria-label="${esc(x.w)} 발음 듣기">🔊</button>
    ${srOK ? `<button class="say rmic" data-act="rowmic" data-w="${esc(x.w)}" aria-label="${esc(x.w)} 따라 읽기">🎤</button>` : ''}
    <input class="write en" data-write="${esc(x.w)}" aria-label="${esc(x.w)} 따라 쓰기" placeholder="따라 써 보세요" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" value="${t.written[x.w] ? esc(x.w) : ''}">
  </li>`).join('')}</ol>
  ${t.done ? '' : `<button class="btn sun wide" data-act="startgame">🎮 게임으로 확인하기</button>`}`;
}
function onRowMic(b) {
  const w = b.dataset.w, row = b.closest('.wrow'), said = row.querySelector('.said');
  said.textContent = '듣고 있어요…';
  listenOnce(b, alts => {
    if (heardMatch(alts, w)) {
      S.today.spoken = S.today.spoken || {};
      said.textContent = '🗣️ 잘 읽었어요!';
      if (!S.today.spoken[w]) {
        S.today.spoken[w] = true; row.classList.add('spoken'); sfxOk(); save();
        const n = S.today.words.length, sc = S.today.words.filter(x => S.today.spoken[x.w]).length;
        const bar = $('#sbar'), c = $('#scnt'); if (bar) bar.style.width = (sc / n * 100) + '%'; if (c) c.textContent = '🗣️ ' + sc + ' / ' + n;
      }
    } else { said.textContent = `“${alts[0] || ''}”로 들렸어요. 다시 듣고 읽어 봐요`; setTimeout(() => speak(w), 200); }
  }, err => { said.textContent = srOK ? failText(err) : ''; if (!srOK) { toast('이 기기에서는 마이크를 쓸 수 없어요'); render(); } });
}
function vGame() {
  if (!G && S.today.done) return `<section class="card center"><div class="big-emoji">🏆</div><h2>오늘 게임 완료!</h2><p class="hint">다음 세트를 시작하면 새 단어로 게임을 할 수 있어요.</p><button class="btn sun" data-act="more">다음 ${S.perDay}개 시작</button></section>`;
  if (!G) return `<section class="card"><div class="center"><div class="big-emoji">🎮</div><h2>단어 확인 게임</h2></div>
    <p class="hint center">단어마다 3단계를 모두 통과하면 완성이에요. 틀리면 그 단계가 다른 게임으로 다시 나와요.</p>
    <ol class="steps"><li><b>읽고 뜻 말하기</b><span>${srOK ? '🎤로 소리 내어 읽으면 맞게 읽었는지 확인하고, 뜻을 물어봐요' : '소리 내어 따라 읽고, 뜻을 골라요'}</span></li>
    <li><b>뜻 알기</b><span>뜻 고르기, 듣고 고르기, 영어 고르기 중 하나</span></li>
    <li><b>스스로 떠올리기</b><span>철자 쓰기, 글자 맞추기${srOK ? ', 뜻 보고 영어로 말하기' : ''} 중 하나</span></li></ol>
    <button class="btn sun wide" data-act="begin">게임 시작</button></section>`;
  return `<div class="gtop"><div class="bar"><i id="gbar"></i></div><span id="gcnt"></span></div><section class="gcard" id="garea"></section>`;
}
function vRecord() {
  const now = new Date();
  if (recY == null) { recY = now.getFullYear(); recM = now.getMonth(); }
  const ym = recY + '-' + String(recM + 1).padStart(2, '0');
  const days = Object.keys(S.records).filter(k => k.startsWith(ym));
  const first = new Date(recY, recM, 1).getDay(), dim = new Date(recY, recM + 1, 0).getDate(), tk = dkey(now);
  let cells = '';
  for (let i = 0; i < first; i++) cells += '<span class="cell empty"></span>';
  for (let d = 1; d <= dim; d++) {
    const k = ym + '-' + String(d).padStart(2, '0'), r = S.records[k];
    cells += `<button class="cell ${r ? 'done' : ''} ${k === tk ? 'today' : ''} ${k === selDay ? 'sel' : ''}" data-act="day" data-k="${k}" ${r ? '' : 'disabled'} aria-label="${d}일${r ? ', ' + r.count + '개' : ''}"><span class="dn">${d}</span>${r ? `<span class="dc">⭐${r.count}</span>` : ''}</button>`;
  }
  const sel = selDay && selDay.startsWith(ym) && S.records[selDay];
  const months = {};
  Object.entries(S.records).forEach(([k, r]) => { const m = k.slice(0, 7); months[m] = months[m] || { c: 0, d: 0 }; months[m].c += r.count; months[m].d++; });
  const mk = Object.keys(months).sort().reverse();
  return `<div class="vh"><button class="btn small" data-act="prevm" aria-label="이전 달">‹</button><h2>${recY}년 ${recM + 1}월</h2><button class="btn small" data-act="nextm" aria-label="다음 달">›</button></div>
  <section class="hero-rec"><span class="en mega">${monthTotal(ym)}</span><p>이 달에 외운 단어</p><div class="mini"><span>공부한 날 <b>${days.length}일</b></span><span>지금까지 모두 <b>${allTotal()}개</b></span></div></section>
  <div class="week">${'일월화수목금토'.split('').map(x => `<span>${x}</span>`).join('')}</div>
  <div class="cal">${cells}</div>
  ${sel ? `<section class="card"><h3>${+selDay.slice(5, 7)}월 ${+selDay.slice(8)}일에 외운 단어 ${sel.count}개</h3><p class="hint">단어를 누르면 발음이 나와요.</p><ul class="chips">${sel.words.map(s => { const i = s.indexOf('|'); const w = s.slice(0, i), m = s.slice(i + 1); return `<li><button data-act="say" data-say="${esc(w)}"><span class="en">${esc(w)}</span> ${esc(m)}</button></li>`; }).join('')}</ul></section>`
    : `<p class="hint center" style="margin-top:14px">별이 붙은 날을 누르면 그날 외운 단어가 보여요.</p>`}
  ${mk.length ? `<section class="card"><h3>달마다 모아 보기</h3><table class="months"><tbody>${mk.map(m => `<tr><td>${m.slice(0, 4)}년 ${+m.slice(5)}월</td><td>${months[m].d}일 공부</td><td>${months[m].c}개</td></tr>`).join('')}</tbody></table></section>` : ''}`;
}
function vSettings() {
  const L = activeList();
  return `<h2>설정</h2>
  <section class="card form">
    <label>아이 이름<input id="s-name" value="${esc(S.name)}" placeholder="예: 민준" maxlength="12"></label>
    <label>하루에 외울 단어 수<select id="s-per">${[10, 15, 20, 25, 30].map(n => `<option value="${n}" ${n === S.perDay ? 'selected' : ''}>${n}개</option>`).join('')}</select></label>
    <label>읽어 주는 속도<select id="s-rate">${[[0.7, '천천히'], [0.85, '보통'], [1, '빠르게']].map(([v, t]) => `<option value="${v}" ${+S.rate === v ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
    <label class="check"><input type="checkbox" id="s-sfx" ${S.sfx ? 'checked' : ''}> 효과음과 팡파레 켜기</label>
    <button class="btn small" data-act="testsound">🔊 소리 확인하기</button>
  </section>
  <section class="card form">
    <h3>단어장</h3>
    <p class="hint">지금 쓰는 단어장: ${ptrKey() === 'custom' ? '내 단어장' : '교육부 초등 필수 어휘'} ${L.length}개. 다음 세트는 ${(S.ptr[ptrKey()] % L.length) + 1}번째 단어부터예요.</p>
    <label>내 단어장 (한 줄에 하나, 영어 다음에 쉼표와 뜻)<textarea id="s-custom" rows="7" placeholder="apple, 사과&#10;library, 도서관">${esc(S.custom.map(x => x.w + ', ' + x.m).join('\n'))}</textarea></label>
    <div class="row"><button class="btn sun" data-act="usecustom">내 단어장으로 바꾸기</button><button class="btn" data-act="usebase">교육부 800개 쓰기</button></div>
  </section>
  <section class="card form">
    <h3>앱 설치</h3>
    ${isStandalone() ? `<p class="hint">✅ 앱으로 설치되어 있어요. 인터넷이 없어도 열려요.</p>` : installEvt ? `<p class="hint">휴대폰에 앱으로 설치하면 아이콘으로 바로 열 수 있어요.</p><button class="btn sun" data-act="install">📲 앱 설치하기</button>` : `<p class="hint">안드로이드: 크롬 오른쪽 위 ⋮ → 앱 설치(또는 홈 화면에 추가)<br>아이폰: Safari 아래쪽 공유 버튼 → 홈 화면에 추가</p>`}
  </section>
  <section class="card form">
    <h3>기록 관리</h3>
    <p class="hint" id="storeinfo">${storeText()}</p>
    <div class="row"><button class="btn sun" data-act="backup">💾 기록 백업하기</button><button class="btn" data-act="restore">📂 기록 복원하기</button></div>
    <p class="hint">백업 파일 이름: 영어단어_${dkey(new Date())}.json${S.lastBackup ? `<br>마지막 백업: ${S.lastBackup}` : ''}</p>
    <div class="row"><button class="btn" data-act="resetptr">진도 처음부터</button><button class="btn danger" data-act="resetall">모든 기록 지우기</button></div>
  </section>`;
}
function parseCustom(text) {
  const out = [], seen = new Set();
  text.split(/\r?\n/).forEach(line => {
    const l = line.trim(); if (!l) return;
    let m = l.match(/^([A-Za-z][A-Za-z' .-]*?)\s*[,\t=:]\s*(.+)$/) || l.match(/^([A-Za-z][A-Za-z'.-]*)\s+([^A-Za-z].*)$/);
    if (!m) return;
    const w = m[1].trim(), mean = m[2].trim().replace(/\|/g, '/');
    if (w && mean && !seen.has(w.toLowerCase())) { seen.add(w.toLowerCase()); out.push({ w, m: mean }); }
  });
  return out;
}
function resetTodayIfOpen() { if (!S.today.done) { S.today = newSet(dkey(new Date())); G = null; } }

/* ===== 백업과 복원 ===== */
async function doBackup() {
  const today = dkey(new Date()), name = '영어단어_' + today + '.json';
  const data = JSON.stringify({ app: 'vocab20', version: 1, exportedAt: new Date().toISOString(), state: Object.assign({}, S, { lastBackup: today }) }, null, 2);
  const done = () => { S.lastBackup = today; save(); render(); toast('백업 파일을 저장했어요: ' + name); };
  let dl = null;
  try { if (window.claude && window.claude.use) dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename: name, data }); done(); }
    catch (e) {
      const c = e && e.code;
      if (c === 'declined') toast('저장을 취소했어요');
      else if (c === 'rate_limited') toast('잠시 뒤 다시 눌러 주세요');
      else toast('이 화면에서는 파일 저장을 쓸 수 없어요');
    }
    return;
  }
  try {
    const u = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 3000); done();
  } catch (e) { toast('파일을 저장하지 못했어요'); }
}
function doRestore() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json'; inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.addEventListener('change', () => {
    const f = inp.files && inp.files[0]; inp.remove(); if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const j = JSON.parse(rd.result), st = j && j.app === 'vocab20' ? j.state : j;
        if (!st || typeof st !== 'object' || !st.records || typeof st.records !== 'object') throw new Error('bad');
        const days = Object.keys(st.records).length, total = Object.values(st.records).reduce((s, r) => s + ((r && r.count) || 0), 0);
        if (!confirm(`이 파일에는 ${days}일 동안 외운 단어 ${total}개 기록이 있어요.\n지금 기록을 이 파일 내용으로 바꿀까요?`)) return;
        stopListen(); G = null; S = normalize(st); save(); render(); toast('기록을 복원했어요');
      } catch (e) { toast('영어단어 백업 파일이 아니에요. 다시 골라 주세요'); }
    };
    rd.onerror = () => toast('파일을 읽지 못했어요');
    rd.readAsText(f);
  });
  inp.click();
}

/* ===== 이벤트 ===== */
document.querySelector('.nav').addEventListener('click', e => { const b = e.target.closest('button[data-v]'); if (b) { ac(); go(b.dataset.v); } });
const main = $('#main');
main.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  ac();
  const a = b.dataset.act;
  if (a === 'say') speak(b.dataset.say);
  else if (a === 'all') speakAll();
  else if (a === 'startgame' || a === 'begin') startSession();
  else if (a === 'more') { S.today = newSet(dkey(new Date())); G = null; save(); go('today'); }
  else if (a === 'opt') {
    if (!G || G.locked) return;
    const q = G.cur, f = (q.type === 'meaning' || q.type === 'read') ? 'm' : 'w', ok = b.dataset.v === q.w[f];
    b.classList.add(ok ? 'good' : 'bad');
    if (!ok) main.querySelectorAll('.opt').forEach(o => { if (o.dataset.v === q.w[f]) o.classList.add('good'); });
    answer(ok);
  }
  else if (a === 'tile') {
    const q = G && G.cur; if (!q || G.locked) return;
    const k = +b.dataset.k; if (q.picked.includes(k) || q.picked.length >= q.w.w.length) return;
    q.picked.push(k); drawScr();
    if (q.picked.length === q.w.w.length) answer(norm(q.picked.map(i => q.letters[i].c).join('')) === norm(q.w.w));
  }
  else if (a === 'slot') { const q = G && G.cur; if (!q || G.locked) return; const k = +b.dataset.k; if (k < q.picked.length) { q.picked.splice(k, 1); drawScr(); } }
  else if (a === 'clear') { const q = G && G.cur; if (!q || G.locked) return; q.picked = []; drawScr(); }
  else if (a === 'spell') checkSpell();
  else if (a === 'next') nextQ();
  else if (a === 'mic') onMic(b);
  else if (a === 'rowmic') onRowMic(b);
  else if (a === 'readok') { const q = G && G.cur; if (q && !G.locked && q.type === 'read') { q.step = 'mean'; $('#readzone').innerHTML = readZone(q); } }
  else if (a === 'giveup') answer(false);
  else if (a === 'backup') doBackup();
  else if (a === 'install') { if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); }); } }
  else if (a === 'restore') doRestore();
  else if (a === 'prevm') { recM--; if (recM < 0) { recM = 11; recY--; } selDay = null; render(); }
  else if (a === 'nextm') { recM++; if (recM > 11) { recM = 0; recY++; } selDay = null; render(); }
  else if (a === 'day') { selDay = b.dataset.k; render(); }
  else if (a === 'testsound') { speak('Great job!'); sfxOk(); }
  else if (a === 'usecustom') {
    const list = parseCustom($('#s-custom').value);
    if (!list.length) { toast('apple, 사과 처럼 한 줄에 하나씩 써 주세요'); return; }
    S.custom = list; S.useCustom = true; S.ptr.custom = 0; resetTodayIfOpen(); save(); render(); toast('내 단어장 ' + list.length + '개로 바꿨어요');
  }
  else if (a === 'usebase') { S.useCustom = false; resetTodayIfOpen(); save(); render(); toast('교육부 초등 필수 어휘로 바꿨어요'); }
  else if (a === 'resetptr') { if (confirm('단어 진도를 1번째 단어부터 다시 시작할까요? 기록은 그대로 남아요.')) { S.ptr[ptrKey()] = 0; resetTodayIfOpen(); save(); render(); toast('진도를 처음으로 돌렸어요'); } }
  else if (a === 'resetall') { if (confirm('모든 기록과 진도를 지울까요? 되돌릴 수 없어요.')) { const keep = { name: S.name, perDay: S.perDay, rate: S.rate, sfx: S.sfx, custom: S.custom, useCustom: S.useCustom }; S = normalize(keep); G = null; save(); render(); toast('기록을 모두 지웠어요'); } }
});
function checkSpell() {
  const q = G && G.cur, i = $('#spellin'); if (!q || G.locked || !i) return;
  if (!i.value.trim()) { i.focus(); return; }
  answer(norm(i.value) === norm(q.w.w));
}
main.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'spellin') { e.preventDefault(); checkSpell(); } });
main.addEventListener('input', e => {
  const inp = e.target.closest('[data-write]'); if (!inp) return;
  const w = inp.dataset.write;
  if (norm(inp.value) === norm(w) && !S.today.written[w]) {
    S.today.written[w] = true; inp.closest('.wrow').classList.add('ok'); sfxOk(); speak(w); save();
    const n = S.today.words.length, wc = S.today.words.filter(x => S.today.written[x.w]).length;
    $('#wbar').style.width = (wc / n * 100) + '%'; $('#wcnt').textContent = wc + ' / ' + n + ' 써 봤어요';
    if (wc === n) toast(n + '개 모두 써 봤어요! 이제 게임으로 확인해요');
  }
});
main.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 's-name') { S.name = e.target.value.trim(); save(); renderHeader(); }
  else if (id === 's-per') { S.perDay = +e.target.value; resetTodayIfOpen(); save(); render(); toast('하루 ' + S.perDay + '개로 바꿨어요'); }
  else if (id === 's-rate') { S.rate = +e.target.value; save(); speak('apple'); }
  else if (id === 's-sfx') { S.sfx = e.target.checked; save(); }
});

/* ===== 설치형 앱: 오프라인 저장 + 설치 버튼 ===== */
let installEvt = null;
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (view === 'settings') render(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast('앱을 설치했어요! 홈 화면의 영단어 아이콘으로 열어 주세요'); });
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(e => console.warn('오프라인 저장 등록 실패', e)); });
}

/* ===== 시작 ===== */
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
render();
initRemote();
</script>
</body>
